# Auto-deploy on push to v2 once these repo secrets exist:
#   DEPLOY_HOST (server IP or hostname), DEPLOY_USER (a sudo user), DEPLOY_SSH_KEY (its private key)
# Without them the job runs but every step is skipped, so the run stays green.
name: Deploy
on:
  push:
    branches: [v2]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Skip when no server is configured
        if: env.DEPLOY_HOST == ''
        run: echo "DEPLOY_HOST secret not set; nothing to deploy."
      - name: Update the server
        if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: sudo bash /srv/invitations/deploy/update.sh
