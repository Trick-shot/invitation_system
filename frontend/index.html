<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f2f2f0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Trickshot Invitations</title>
    <!--
      Boot screen. Painted from this file alone, before any script or font arrives,
      so a slow connection shows the brand and a moving bar instead of a blank page.
      React replaces it on first render; .boot in the app (PageLoader) looks the same,
      so the hand-over is invisible.
    -->
    <style>
      html, body { margin: 0; background: #f2f2f0; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f2f2f0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #78716c; }
      .boot-in { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .boot-mark { width: 48px; height: 48px; animation: boot-breathe 1.6s ease-in-out infinite; }
      .boot-bar { width: 120px; height: 3px; border-radius: 3px; background: #e4e4e1; overflow: hidden; position: relative; }
      .boot-bar::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: 3px; background: #6341a8; animation: boot-slide 1.1s cubic-bezier(.65,0,.35,1) infinite; }
      .boot-name { font-size: 13px; font-weight: 500; letter-spacing: .01em; }
      .boot-slow { font-size: 12px; opacity: 0; animation: boot-show .3s ease 6s forwards; }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes boot-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @keyframes boot-show { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot-mark, .boot-bar::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading">
        <div class="boot-in">
          <svg class="boot-mark" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 4h16a2 2 0 0 1 2 2v3.2a2.8 2.8 0 0 0 0 5.6V18a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-3.2a2.8 2.8 0 0 0 0-5.6V6a2 2 0 0 1 2-2z" fill="#6341a8" />
            <rect x="6.5" y="8.5" width="6" height="6" rx="1" stroke="#fff" stroke-width="1.6" fill="none" />
            <rect x="8.6" y="10.6" width="1.8" height="1.8" fill="#fff" />
            <rect x="15" y="8.5" width="3" height="1.8" rx=".6" fill="#fff" /><rect x="15" y="12.7" width="3" height="1.8" rx=".6" fill="#fff" />
            <circle cx="16.5" cy="17" r="1.4" fill="#d8ee3f" />
          </svg>
          <div class="boot-bar"></div>
          <div class="boot-name">Trickshot Invitations</div>
          <div class="boot-slow">Slow connection. Still loading.</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
