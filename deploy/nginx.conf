# /etc/nginx/sites-available/invitations
server {
    listen 80;
    server_name trickshot.tech www.trickshot.tech;
    return 301 https://trickshot.tech$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trickshot.tech;

    ssl_certificate     /etc/letsencrypt/live/trickshot.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trickshot.tech/privkey.pem;

    client_max_body_size 20m;

    # gzip, long caching for hashed assets, no-cache for index.html
    include /srv/invitations/deploy/nginx-performance.conf;

    # React build
    root /srv/invitations/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://unix:/run/invitations/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /admin/ {
        proxy_pass http://unix:/run/invitations/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ { alias /srv/invitations/staticfiles/; expires 30d; }
    location /media/  { alias /srv/invitations/media/;  expires 7d; add_header X-Robots-Tag "noindex"; }

    # Everything else is the SPA (admin app, scanner, guest page /i/<token>)
    location / { try_files $uri /index.html; }
}
