# Speed settings for the invitations site. Included inside the site's `server { }` block:
#     include /var/www/projects/invitation_system/deploy/nginx-performance.conf;
#
# Why: Ubuntu's nginx compresses only text/html by default, so the app's JavaScript
# went over the wire uncompressed (about 3x larger). And hashed build files can be
# cached forever, while index.html must always be checked, or a deploy is not seen.

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/css text/plain application/javascript application/json application/manifest+json image/svg+xml;

# Vite build output: file names contain a content hash, so they never change.
location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Illustrations and email images: stable names, change rarely.
location ~ ^/(illustrations|email)/ {
    try_files $uri =404;
    expires 7d;
}

# The app shell. Always revalidated, so a new deploy is picked up on the next visit.
location = /index.html {
    add_header Cache-Control "no-cache";
}
